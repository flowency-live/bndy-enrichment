name: Repair package lock once

on:
  push:
    branches: [codex/repair-package-lock]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'Refresh package lock')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/repair-package-lock

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate and verify lockfile without install scripts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit only the repaired lockfile
        run: |
          set -euo pipefail
          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/repair-package-lock-once.yml
          git add package-lock.json
          git commit -m "Refresh package lock"
          git push origin HEAD:codex/repair-package-lock
