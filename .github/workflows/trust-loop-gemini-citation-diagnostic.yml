name: Diagnose Gemini-native Backline citations

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "Run one Backline Gemini citation diagnostic"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: trust-loop-gemini-citation-diagnostic
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      (github.event_name == 'workflow_dispatch'
      && github.event.inputs.confirmation == 'Run one Backline Gemini citation diagnostic')
      || (github.event_name == 'push'
      && startsWith(github.event.head_commit.message, 'Run one Backline Gemini citation diagnostic'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Enforce unused one-shot target
        run: test ! -e ops/enrichment/gemini-native-citation-diagnostic-unreviewed.json
      - name: Load deployed Gemini credential
        run: |
          set -euo pipefail
          SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name BndyEnrichmentStack \
            --query "Stacks[0].Outputs[?OutputKey=='GeminiSecretArn'].OutputValue | [0]" \
            --output text)
          test -n "$SECRET_ARN"
          test "$SECRET_ARN" != "None"
          GEMINI_API_KEY=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --query SecretString \
            --output text | jq -r '.apiKey // empty')
          test -n "$GEMINI_API_KEY"
          echo "::add-mask::$GEMINI_API_KEY"
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> "$GITHUB_ENV"
      - name: Capture exactly one shadow-only diagnostic case
        env:
          GEMINI_MODEL: gemini-3.6-flash
        run: |
          set -euo pipefail
          npm run trust-loop:diagnose-gemini-citations | tee trust-loop-gemini-citation-diagnostic.log
          jq -e '
            .cases == 1
            and .canonicalWrites == 0
            and .reviewStatus == "unreviewed"
          ' ops/enrichment/gemini-native-citation-diagnostic-unreviewed.json >/dev/null
      - name: Record the unreviewed public diagnostic
        run: |
          set -euo pipefail
          git config user.name bndy-backline-bot
          git config user.email actions@users.noreply.github.com
          git pull --rebase --autostash origin main
          git add ops/enrichment/gemini-native-citation-diagnostic-unreviewed.json
          git commit -m "Record unreviewed Backline Gemini citation diagnostic"
          git push origin HEAD:main
      - name: Require a completed provider response
        run: |
          jq -e '
            .contract.exactlyOneModelCall == true
            and .contract.providerResponseCaptured == true
          ' ops/enrichment/gemini-native-citation-diagnostic-unreviewed.json >/dev/null
