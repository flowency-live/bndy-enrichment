name: Deploy Claim V2 authority consumer once

on:
  push:
    branches: [ops/deploy-claim-v2-authority-20260829]

permissions:
  contents: read
  id-token: write

concurrency:
  group: bndy-enrichment-claim-authority-production
  cancel-in-progress: false

jobs:
  deploy-and-accept:
    if: contains(github.event.head_commit.message, '[deploy-claim-authority]')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/deploy-claim-v2-authority-20260829
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate release
        run: |
          npm run build
          npm test
          npm run synth
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Deploy current Backline stack
        run: |
          npx cdk bootstrap
          npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json
      - name: Verify stream wiring and privacy boundary end to end
        id: acceptance
        env:
          RUN_ID: ${{ github.run_id }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          STACK_NAME=BndyEnrichmentStack
          CLAIMS_TABLE=bndy-entity-claims
          CLAIM_ID="codex-claim-authority-e2e-${RUN_ID}"
          ENTITY_ID="codex-claim-authority-entity-${RUN_ID}"
          USER_ID="codex-claim-authority-user-${RUN_ID}"
          EXPLANATION="temporary-sensitive-e2e-marker-${RUN_ID}"
          EMAIL="claim-authority-e2e-${RUN_ID}@example.invalid"
          AUTHORITY_ID="authority:${CLAIM_ID}:r1:pending_review"
          AUTHORITY_PK="AUTHORITY#${AUTHORITY_ID}"

          STATE_TABLE=$(jq -r '.BndyEnrichmentStack.StateTableName' cdk-outputs.json)
          STREAM_ARN=$(aws ssm get-parameter --name /bndy/claims/stream-arn --query 'Parameter.Value' --output text)
          LIVE_STREAM_ARN=$(aws dynamodb describe-table --table-name "$CLAIMS_TABLE" --query 'Table.LatestStreamArn' --output text)
          test "$STREAM_ARN" = "$LIVE_STREAM_ARN"

          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].StackStatus' --output text)
          case "$STACK_STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "Unexpected stack status: $STACK_STATUS" >&2; exit 1 ;;
          esac

          WORKER_FUNCTION=$(aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --query "StackResourceSummaries[?ResourceType=='AWS::Lambda::Function' && contains(LogicalResourceId, 'ClaimAuthorityStreamWorker')].PhysicalResourceId | [0]" \
            --output text)
          test -n "$WORKER_FUNCTION"
          test "$WORKER_FUNCTION" != None
          aws lambda wait function-active-v2 --function-name "$WORKER_FUNCTION"

          MAPPING_UUID=$(aws lambda list-event-source-mappings \
            --function-name "$WORKER_FUNCTION" \
            --event-source-arn "$STREAM_ARN" \
            --query 'EventSourceMappings[0].UUID' \
            --output text)
          test -n "$MAPPING_UUID"
          test "$MAPPING_UUID" != None

          for attempt in $(seq 1 24); do
            MAPPING_STATE=$(aws lambda get-event-source-mapping --uuid "$MAPPING_UUID" --query State --output text)
            if [ "$MAPPING_STATE" = Enabled ]; then break; fi
            if [ "$MAPPING_STATE" = Disabled ] || [ "$MAPPING_STATE" = Failed ]; then
              echo "Event source mapping entered $MAPPING_STATE" >&2
              exit 1
            fi
            sleep 5
          done
          test "$MAPPING_STATE" = Enabled

          cleanup() {
            set +e
            aws dynamodb delete-item \
              --table-name "$CLAIMS_TABLE" \
              --key "{\"claim_id\":{\"S\":\"$CLAIM_ID\"}}" >/dev/null
            aws dynamodb delete-item \
              --table-name "$STATE_TABLE" \
              --key "{\"pk\":{\"S\":\"$AUTHORITY_PK\"},\"sk\":{\"S\":\"META\"}}" >/dev/null
          }
          trap cleanup EXIT

          jq -n \
            --arg claimId "$CLAIM_ID" \
            --arg entityId "$ENTITY_ID" \
            --arg userId "$USER_ID" \
            --arg explanation "$EXPLANATION" \
            --arg email "$EMAIL" \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg publicReference "https://example.invalid/bndy-claim-e2e/${RUN_ID}" \
            '{
              claim_id:{S:$claimId},
              entity_type:{S:"artist"},
              entity_id:{S:$entityId},
              entity_name:{S:"Temporary Claim Authority Acceptance"},
              user_id:{S:$userId},
              requested_role:{S:"owner"},
              relationship_kind:{S:"artist_owner"},
              status:{S:"pending_review"},
              verification_method:{S:"manual"},
              source:{S:"join_bndy_v2"},
              evidence_revision:{N:"1"},
              evidence:{L:[{M:{
                method:{S:"manual_explanation"},
                public_reference:{S:$publicReference},
                metadata:{M:{explanation:{S:$explanation},official_email:{S:$email}}}
              }}]},
              created_at:{S:$now},
              updated_at:{S:$now},
              entity_key:{S:("artist#"+$entityId)},
              user_key:{S:$userId}
            }' > /tmp/claim-authority-e2e-item.json

          aws dynamodb put-item \
            --table-name "$CLAIMS_TABLE" \
            --item file:///tmp/claim-authority-e2e-item.json

          FOUND=false
          for attempt in $(seq 1 24); do
            aws dynamodb get-item \
              --table-name "$STATE_TABLE" \
              --consistent-read \
              --key "{\"pk\":{\"S\":\"$AUTHORITY_PK\"},\"sk\":{\"S\":\"META\"}}" \
              > /tmp/claim-authority-e2e-result.json
            if jq -e '.Item.recordType.S == "AuthorityAssertion"' /tmp/claim-authority-e2e-result.json >/dev/null; then
              FOUND=true
              break
            fi
            sleep 5
          done
          test "$FOUND" = true

          jq -e \
            --arg claimId "$CLAIM_ID" \
            --arg entityId "$ENTITY_ID" \
            --arg userId "$USER_ID" \
            --arg explanation "$EXPLANATION" \
            --arg email "$EMAIL" \
            '
              .Item.claimRequestId.S == $claimId and
              .Item.entityType.S == "artist" and
              .Item.entityId.S == $entityId and
              (.Item.actorRef.S | test("^bndy-user:[a-f0-9]{32}$")) and
              .Item.evidenceClasses.M.explanationSupplied.BOOL == true and
              .Item.evidenceClasses.M.officialEmailSupplied.BOOL == true and
              .Item.evidenceClasses.M.supportingUrlSupplied.BOOL == true and
              .Item.evidenceClasses.M.facebookPageControlSupplied.BOOL == false and
              ((.Item | tostring | contains($userId)) | not) and
              ((.Item | tostring | contains($explanation)) | not) and
              ((.Item | tostring | contains($email)) | not)
            ' /tmp/claim-authority-e2e-result.json >/dev/null

          cleanup
          trap - EXIT

          aws dynamodb get-item \
            --table-name "$CLAIMS_TABLE" \
            --consistent-read \
            --key "{\"claim_id\":{\"S\":\"$CLAIM_ID\"}}" \
            | jq -e 'has("Item") | not' >/dev/null
          aws dynamodb get-item \
            --table-name "$STATE_TABLE" \
            --consistent-read \
            --key "{\"pk\":{\"S\":\"$AUTHORITY_PK\"},\"sk\":{\"S\":\"META\"}}" \
            | jq -e 'has("Item") | not' >/dev/null

          mkdir -p ops
          jq -n \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runId "$RUN_ID" \
            --arg deployedSha "$DEPLOYED_SHA" \
            --arg stackStatus "$STACK_STATUS" \
            --arg workerFunction "$WORKER_FUNCTION" \
            --arg mappingState "$MAPPING_STATE" \
            '{
              verifiedAt:$verifiedAt,
              workflowRunId:$runId,
              deployedSha:$deployedSha,
              claimConsumerCommit:"d836d84cafa6f5de7b01179861839674334e1fd3",
              deployment:"success",
              stackStatus:$stackStatus,
              workerFunction:$workerFunction,
              eventSourceMapping:$mappingState,
              streamPointerMatchesLiveTable:true,
              privacySafeEndToEndAcceptance:true,
              rawClaimantMaterialRetained:false,
              factualKnowledgeClaimCreated:false,
              canonicalWritesEnabled:false,
              temporaryRecordsRemoved:true
            }' > ops/claim-v2-authority-production-acceptance.json
          cat ops/claim-v2-authority-production-acceptance.json
          {
            echo '### Claim V2 authority production acceptance'
            echo '```json'
            cat ops/claim-v2-authority-production-acceptance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
