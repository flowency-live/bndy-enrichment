name: Deploy Lemonrock recovery runtime

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  recover:
    if: contains(github.event.head_commit.message, 'Deploy Lemonrock recovery runtime')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      AWS_REGION: eu-west-2
      STACK_NAME: BndyEnrichmentStack
      STATUS_FILE: ops/lemonrock-recovery-run.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialise sanitised recovery status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          jq -n \
            --arg startedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deployedSha "$(git rev-parse HEAD)" \
            '{
              phase:"initialising",
              status:"running",
              startedAt:$startedAt,
              deployedSha:$deployedSha,
              shadow:true,
              canonicalWritesEnabled:false
            }' > "$STATUS_FILE"

      - name: Require dedicated deployment role
        env:
          AWS_DEPLOY_ROLE_ARN: \${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_DEPLOY_ROLE_ARN"

      - name: Configure AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: \${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Validate exact main revision
        run: |
          set -euo pipefail
          jq '.phase = "validating"' "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"
          npm install
          npm run build
          npm run test
          npm run check
          npx cdk synth >/tmp/cdk-synth.log

      - name: Deploy retry and inventory-control runtime
        run: |
          set -euo pipefail
          jq '.phase = "deploying"' "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"
          npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json

      - name: Replay directory controls and redrive dead letters
        shell: bash
        run: |
          set -euo pipefail
          state_table=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.StateTableName)")
          queue_url=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.SourceScanQueueUrl)")

          aws dynamodb get-item \
            --table-name "$state_table" \
            --key '{"pk":{"S":"SOURCE#lemonrock-full-reconcile"},"sk":{"S":"STATE"}}' \
            --projection-expression "metadata" \
            --output json > /tmp/full-reconcile-state.json
          reconciliation_id=$(jq -r '.Item.metadata.M.lastReconciliationId.S // empty' /tmp/full-reconcile-state.json)
          test -n "$reconciliation_id"

          requested_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for source in artist venue; do
            if [ "$source" = "artist" ]; then
              source_id="lemonrock-artist-index"
              kind="artist-index"
              url="https://www.lemonrock.com/allbands.php"
            else
              source_id="lemonrock-venue-index"
              kind="venue-index"
              url="https://www.lemonrock.com/allvenues.php"
            fi
            body=$(jq -nc \
              --arg sourceId "$source_id" \
              --arg kind "$kind" \
              --arg url "$url" \
              --arg requestedAt "$requested_at" \
              --arg reconciliationId "$reconciliation_id" \
              '{sourceId:$sourceId,reason:"manual",requestedAt:$requestedAt,reconciliationId:$reconciliationId,task:{kind:$kind,url:$url}}')
            aws sqs send-message --queue-url "$queue_url" --message-body "$body" >/dev/null
          done

          redrive_policy=$(aws sqs get-queue-attributes \
            --queue-url "$queue_url" \
            --attribute-names RedrivePolicy \
            --query 'Attributes.RedrivePolicy' \
            --output text)
          dlq_arn=$(jq -r '.deadLetterTargetArn' <<<"$redrive_policy")
          dlq_name="\${dlq_arn##*:}"
          dlq_url=$(aws sqs get-queue-url --queue-name "$dlq_name" --query QueueUrl --output text)
          dlq_visible=$(aws sqs get-queue-attributes \
            --queue-url "$dlq_url" \
            --attribute-names ApproximateNumberOfMessages \
            --query 'Attributes.ApproximateNumberOfMessages' \
            --output text)

          redrive_started=false
          if [ "$dlq_visible" -gt 0 ]; then
            aws sqs start-message-move-task \
              --source-arn "$dlq_arn" \
              --max-number-of-messages-per-second 3 >/dev/null
            redrive_started=true
          fi

          jq \
            --arg reconciliationId "$reconciliation_id" \
            --argjson recoveredDLQMessages "$dlq_visible" \
            --argjson redriveStarted "$redrive_started" \
            '.phase = "recovery-started"
             | .status = "running"
             | .reconciliationId = $reconciliationId
             | .directoryReplayQueued = 2
             | .recoveredDLQMessages = $recoveredDLQMessages
             | .redriveStarted = $redriveStarted' \
            "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"

      - name: Publish sanitised recovery evidence
        if: always()
        env:
          JOB_STATUS: \${{ job.status }}
        run: |
          set -euo pipefail
          if [ ! -f "$STATUS_FILE" ]; then
            mkdir -p ops
            jq -n '{phase:"unknown",status:"failed",shadow:true,canonicalWritesEnabled:false}' > "$STATUS_FILE"
          fi
          jq \
            --arg jobStatus "$JOB_STATUS" \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            'if $jobStatus == "success"
               then .status = "recovery-started"
               else .status = "failed"
             end
             | .completedAt = $completedAt' \
            "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"

          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$STATUS_FILE"
          git commit -m "Record Lemonrock recovery deployment status" || exit 0
          if ! git push origin HEAD:main; then
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
