name: Probe all On The Case tasks once

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, 'Probe all On The Case tasks')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Capture all task state
        run: |
          set -euo pipefail
          STATE_TABLE=$(aws cloudformation describe-stacks --stack-name BndyEnrichmentStack --query "Stacks[0].Outputs[?OutputKey=='StateTableName'].OutputValue | [0]" --output text)
          aws dynamodb scan --table-name "$STATE_TABLE" --filter-expression "sourceFamily = :family" --expression-attribute-values '{":family":{"S":"onthecase"}}' > /tmp/all.json
          jq '{capturedAt:(now|todate),total:(.Items|length),bySource:([.Items[]|{sourceId:(.sourceId.S//"unknown"),status:(.status.S//"unknown"),rid:(.lastReconciliationId.S//.reconciliationId.S//"none")}]|group_by(.sourceId)|map({sourceId:.[0].sourceId,count:length,statuses:(group_by(.status)|map({status:.[0].status,count:length})),reconciliations:(group_by(.rid)|map({reconciliationId:.[0].rid,count:length}))})),bandTasks:[.Items[]|select(.sourceId.S=="onthecase-band-hydration")|{taskKey:.taskKey.S,status:.status.S,reconciliationId:(.reconciliationId.S//null),lastReconciliationId:(.lastReconciliationId.S//null),queuedAt:(.queuedAt.S//null),startedAt:(.startedAt.S//null),completedAt:(.completedAt.S//null),failedAt:(.failedAt.S//null),attemptCount:(.attemptCount.N//null)}]}' /tmp/all.json > ops/onthecase-all-task-probe.json
      - name: Publish evidence
        run: |
          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add ops/onthecase-all-task-probe.json
          git commit -m "Record all On The Case task state" || exit 0
          git push origin HEAD:main
