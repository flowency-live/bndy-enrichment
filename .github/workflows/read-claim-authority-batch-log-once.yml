name: Read Claim authority batch count once

on:
  push:
    branches: [ops/read-claim-authority-batch-log-20260829]

permissions:
  contents: read
  id-token: write

jobs:
  read-batch-count:
    if: contains(github.event.head_commit.message, '[read-claim-authority-batch-count]')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Read only Claim authority batch counts
        run: |
          set -euo pipefail
          WORKER_FUNCTION=BndyEnrichmentStack-ClaimAuthorityStreamWorker0E6B-SWUTdZhEakId
          START_MS=$(date -u -d '2026-08-29T16:59:00Z' +%s000)
          END_MS=$(date -u -d '2026-08-29T17:03:59Z' +%s000)
          RESULT=$(aws logs filter-log-events \
            --log-group-name "/aws/lambda/${WORKER_FUNCTION}" \
            --start-time "$START_MS" \
            --end-time "$END_MS" \
            --filter-pattern '"Claim authority stream batch"' \
            --query 'events[].{timestamp:timestamp,message:message}' \
            --output json)
          echo "$RESULT"
          {
            echo '### Claim authority batch counts'
            echo '```json'
            echo "$RESULT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
