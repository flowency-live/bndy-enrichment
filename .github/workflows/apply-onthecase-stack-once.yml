name: Apply On The Case stack refactor once

on:
  push:
    branches: [backline/onthecase-productionise]

permissions:
  contents: write

jobs:
  patch-stack:
    if: github.event.head_commit.message == 'Apply On The Case stack schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backline/onthecase-productionise
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply low-cost stack changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/bndy-enrichment-stack.ts')
          text = path.read_text()
          old = """new events.Rule(this, 'SourceDispatchTick', {\n      schedule: events.Schedule.rate(cdk.Duration.minutes(15)),"""
          new = """new events.Rule(this, 'SourceDispatchTick', {\n      schedule: events.Schedule.rate(cdk.Duration.hours(1)),"""
          if old not in text:
              raise SystemExit('SourceDispatchTick marker not found')
          text = text.replace(old, new, 1)
          marker = "    // One cheap root-page acquisition proves the future-gig surface is reachable\n"
          if marker not in text:
              raise SystemExit('Lemonrock health-check marker not found')
          rule = """    // On The Case steady state is gig-led. The hourly complete /gigs snapshot\n    // is the only scheduled root; venue and band profiles are child hydration only.\n    new events.Rule(this, 'OnTheCaseHourlyGigTick', {\n      schedule: events.Schedule.rate(cdk.Duration.hours(1)),\n      targets: [\n        new targets.SqsQueue(sourceScanQueue, {\n          message: events.RuleTargetInput.fromObject({ sourceId: 'onthecase-gig-index', reason: 'scheduled' }),\n        }),\n      ],\n    });\n\n"""
          text = text.replace(marker, rule + marker, 1)
          path.write_text(text)
          PY
      - name: Commit stack refactor and remove one-shot workflow
        run: |
          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-onthecase-stack-once.yml
          git add lib/bndy-enrichment-stack.ts
          git commit -m "Add hourly On The Case gig sweep and hourly dispatcher"
          git push origin HEAD:backline/onthecase-productionise
