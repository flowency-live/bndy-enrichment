name: Patch Claim authority stream consumer once
on:
  push:
    branches: [claim-v2-authority-stream-consumer]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[claim-authority-consumer]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claim-v2-authority-stream-consumer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-claim-authority-stream-consumer.cjs
      - run: npm install
      - run: npm run build
      - run: npm run test
      - run: npm run synth
      - name: Commit
        run: |
          git config user.name 'bndy-product-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/authority/claim-authority.ts src/handlers/claim-authority-stream-worker.ts lib/bndy-enrichment-stack.ts test/claim-authority.test.ts
          git commit -m 'Wire Claim V2 authority stream into Backline'
          git push origin HEAD:claim-v2-authority-stream-consumer
