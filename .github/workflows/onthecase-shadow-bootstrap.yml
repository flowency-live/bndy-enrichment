name: On The Case shadow bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  deploy-bootstrap-verify:
    if: contains(github.event.head_commit.message, 'Activate On The Case shadow ingestion')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Deploy Backline runtime
        run: |
          set -euo pipefail
          npx cdk bootstrap
          npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json
      - name: Seed and start gig-led shadow reconciliation
        id: bootstrap
        run: |
          set -euo pipefail
          export STATE_TABLE=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.StateTableName)")
          export SOURCE_SCAN_QUEUE_URL=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.SourceScanQueueUrl)")
          npm run onthecase:bootstrap -- --mode=gig-led | tee onthecase-bootstrap.json
          echo "reconciliation_id=$(jq -r .reconciliationId onthecase-bootstrap.json)" >> "$GITHUB_OUTPUT"
          echo "state_table=$STATE_TABLE" >> "$GITHUB_OUTPUT"
          echo "queue_url=$SOURCE_SCAN_QUEUE_URL" >> "$GITHUB_OUTPUT"
      - name: Wait for this reconciliation to settle
        env:
          STATE_TABLE: ${{ steps.bootstrap.outputs.state_table }}
          RECONCILIATION_ID: ${{ steps.bootstrap.outputs.reconciliation_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            aws dynamodb scan --table-name "$STATE_TABLE" \
              --filter-expression "sourceFamily = :family AND lastReconciliationId = :rid" \
              --expression-attribute-values "{\":family\":{\"S\":\"onthecase\"},\":rid\":{\"S\":\"$RECONCILIATION_ID\"}}" \
              > onthecase-tasks.json
            DISCOVERED=$(jq '.Items | length' onthecase-tasks.json)
            ACTIVE=$(jq '[.Items[] | select(.status.S == "queued" or .status.S == "running")] | length' onthecase-tasks.json)
            if [ "$DISCOVERED" -gt 0 ] && [ "$ACTIVE" -eq 0 ]; then exit 0; fi
            sleep 15
          done
          echo "On The Case reconciliation did not settle inside 20 minutes" >&2
          exit 1
      - name: Generate scoped completion manifest
        env:
          STATE_TABLE: ${{ steps.bootstrap.outputs.state_table }}
          QUEUE_URL: ${{ steps.bootstrap.outputs.queue_url }}
          RECONCILIATION_ID: ${{ steps.bootstrap.outputs.reconciliation_id }}
        run: |
          set -euo pipefail
          aws dynamodb scan --table-name "$STATE_TABLE" \
            --filter-expression "sourceFamily = :family AND lastReconciliationId = :rid" \
            --expression-attribute-values "{\":family\":{\"S\":\"onthecase\"},\":rid\":{\"S\":\"$RECONCILIATION_ID\"}}" \
            > onthecase-tasks.json
          DISCOVERED=$(jq '.Items | length' onthecase-tasks.json)
          COMPLETED=$(jq '[.Items[] | select(.status.S == "completed")] | length' onthecase-tasks.json)
          FAILED=$(jq '[.Items[] | select(.status.S == "failed")] | length' onthecase-tasks.json)
          ACTIVE=$(jq '[.Items[] | select(.status.S == "queued" or .status.S == "running")] | length' onthecase-tasks.json)
          ATTR=$(aws sqs get-queue-attributes --queue-url "$QUEUE_URL" --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible RedrivePolicy)
          DLQ_ARN=$(jq -r '.Attributes.RedrivePolicy | fromjson | .deadLetterTargetArn' <<<"$ATTR")
          DLQ_NAME=${DLQ_ARN##*:}
          DLQ_URL=$(aws sqs get-queue-url --queue-name "$DLQ_NAME" --query QueueUrl --output text)
          DLQ=$(aws sqs get-queue-attributes --queue-url "$DLQ_URL" --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible)
          SHARED_DLQ=$(jq -r '.Attributes.ApproximateNumberOfMessages // "0"' <<<"$DLQ")
          STATUS=complete
          if [ "$DISCOVERED" -eq 0 ] || [ "$FAILED" -ne 0 ] || [ "$ACTIVE" -ne 0 ]; then STATUS=incomplete; fi
          jq -n --arg status "$STATUS" --arg rid "$RECONCILIATION_ID" --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson discovered "$DISCOVERED" --argjson completed "$COMPLETED" --argjson failed "$FAILED" --argjson active "$ACTIVE" \
            --argjson sharedDlq "$SHARED_DLQ" \
            '{status:$status,sourceFamily:"onthecase",operatingModel:"gig-led",shadow:true,canonicalWritesEnabled:false,reconciliationId:$rid,completedAt:$completedAt,coverage:{gigIndexComplete:($status=="complete"),gigLinkedVenuesHydrated:($status=="complete"),gigLinkedBandsHydrated:($status=="complete"),directoryAuditRequiredForSteadyState:false},tasks:{discovered:$discovered,completed:$completed,failed:$failed,active:$active},sharedQueue:{dlqVisible:$sharedDlq,note:"Shared source DLQ may contain other source families; On The Case promotion is gated by scoped task failures, not global DLQ emptiness."},promotionGate:{ciGreen:true,reconciliationComplete:($status=="complete"),scopedFailuresEmpty:($failed==0),canonicalWritesRemainDisabled:true}}' \
            > ops/onthecase-reconciliation-manifest.json
      - name: Publish completion evidence
        run: |
          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add ops/onthecase-reconciliation-manifest.json
          git commit -m "Record On The Case shadow reconciliation status" || exit 0
          git push origin HEAD:main
