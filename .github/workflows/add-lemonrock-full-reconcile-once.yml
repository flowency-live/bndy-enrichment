name: Add Lemonrock weekly full reconcile once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Wire Lemonrock weekly full reconcile')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish start
        run: |
          mkdir -p ops
          printf '{"phase":"started","runId":"%s","startedAt":"%s"}\n' "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ops/full-reconcile-patch-run.json
          git config user.name 'bndy-backline-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f ops/full-reconcile-patch-run.json
          git commit -m 'Record full reconcile patch start'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add and validate full reconcile target
        id: validate
        continue-on-error: true
        run: |
          STATUS=success
          (
            set -euo pipefail
            node <<'NODE'
            const fs = require('fs');
            const p = 'lib/bndy-enrichment-stack.ts';
            let s = fs.readFileSync(p, 'utf8');
            if (!s.includes("sourceId: 'lemonrock-full-reconcile'")) {
              const needle = `        new targets.SqsQueue(sourceScanQueue, {\n          message: events.RuleTargetInput.fromObject({ sourceId: 'lemonrock-venue-index', reason: 'scheduled' }),\n        }),\n      ],\n    });`;
              const replacement = `        new targets.SqsQueue(sourceScanQueue, {\n          message: events.RuleTargetInput.fromObject({ sourceId: 'lemonrock-venue-index', reason: 'scheduled' }),\n        }),\n        new targets.SqsQueue(sourceScanQueue, {\n          message: events.RuleTargetInput.fromObject({\n            sourceId: 'lemonrock-full-reconcile',\n            reason: 'scheduled',\n            task: { kind: 'future-index', url: 'https://www.lemonrock.com/' },\n          }),\n        }),\n      ],\n    });`;
              if (!s.includes(needle)) throw new Error('weekly directory reconcile block not found');
              fs.writeFileSync(p, s.replace(needle, replacement));
            }
            NODE
            npm install
            npm run check
            npx cdk synth >/tmp/cdk-synth.log
          ) > /tmp/full-reconcile-validation.log 2>&1 || STATUS=failure
          cp /tmp/full-reconcile-validation.log ops/full-reconcile-validation.log
          echo "$STATUS" > /tmp/full-reconcile-status
          test "$STATUS" = success
      - name: Publish result
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          git config user.name 'bndy-backline-bot'
          git config user.email 'actions@users.noreply.github.com'
          if [ "$VALIDATE_OUTCOME" = 'success' ]; then git add lib/bndy-enrichment-stack.ts; fi
          printf '{"phase":"finished","status":"%s","runId":"%s","finishedAt":"%s"}\n' "$VALIDATE_OUTCOME" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ops/full-reconcile-patch-run.json
          git add -f ops/full-reconcile-patch-run.json ops/full-reconcile-validation.log
          git commit -m 'Schedule Lemonrock weekly full reconciliation' || true
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          test "$VALIDATE_OUTCOME" = 'success'
