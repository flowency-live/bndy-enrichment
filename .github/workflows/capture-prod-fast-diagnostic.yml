name: capture-prod-fast-diagnostic

on:
  push:
    branches: [capture-prod-run]
    paths:
      - '.github/workflows/capture-prod-fast-diagnostic.yml'

permissions:
  contents: write
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture-prod-run

      - name: Configure AWS credentials
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Diagnose Capture
        if: always()
        env:
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          HAS_AWS_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
          HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics
          if [ "$AWS_OUTCOME" != "success" ]; then
            jq -n \
              --arg inspectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg awsOutcome "$AWS_OUTCOME" \
              --arg hasAwsRole "$HAS_AWS_ROLE" \
              --arg hasGeminiKey "$HAS_GEMINI_KEY" \
              '{result:"AWS_AUTH_BLOCKER",inspectedAt:$inspectedAt,awsOutcome:$awsOutcome,hasAwsRole:($hasAwsRole=="true"),hasGeminiKey:($hasGeminiKey=="true")}' \
              > diagnostics/capture-facebook-event-fast.json
          else
            set -e
            CAPTURE_FN=$(aws cloudformation describe-stacks --stack-name bndy-capture --region eu-west-2 \
              --query "Stacks[0].Outputs[?OutputKey=='CaptureFunctionName'].OutputValue | [0]" --output text)
            CAPTURE_TOKEN=$(aws lambda get-function-configuration --region eu-west-2 --function-name "$CAPTURE_FN" \
              --query 'Environment.Variables.CAPTURE_TOKEN' --output text)
            echo "::add-mask::$CAPTURE_TOKEN"
            curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
              'https://capture.bndy.co.uk/v1/captures?limit=100' > /tmp/captures.json
            CAPTURE_ID=$(jq -r '
              (.captures // .items // . // [])
              | map(select(
                  ((.sharedUrl // "") | contains("gwHFuwf71")) or
                  ((.sharedUrl // "") | contains("1555240929628880")) or
                  ((.sharedText // "") | contains("gwHFuwf71")) or
                  ((.sharedText // "") | contains("1555240929628880"))
                ))
              | sort_by(.receivedAt // .capturedAt // "") | reverse | .[0].id // empty
            ' /tmp/captures.json)
            if [ -z "$CAPTURE_ID" ]; then
              jq '{result:"NO_MATCHING_CAPTURE",inspectedAt:(now|todateiso8601),recentCaptures:((.captures // .items // . // [])[0:15] | map({id,capturedAt,receivedAt,status,sharedUrl,sharedText,mimeType,sourceApp,note}))}' \
                /tmp/captures.json > diagnostics/capture-facebook-event-fast.json
            else
              curl -fsS -H "Authorization: Bearer $CAPTURE_TOKEN" \
                "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID" > /tmp/capture.json
              jq -n \
                --arg inspectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg captureId "$CAPTURE_ID" \
                --argjson capture "$(jq '.capture // .' /tmp/capture.json)" \
                '{result:"MATCHED_CAPTURE",inspectedAt:$inspectedAt,captureId:$captureId,capture:{id:$capture.id,capturedAt:$capture.capturedAt,receivedAt:$capture.receivedAt,updatedAt:$capture.updatedAt,status:$capture.status,sharedUrl:$capture.sharedUrl,sharedText:$capture.sharedText,mimeType:$capture.mimeType,sourceApp:$capture.sourceApp,suggestedEntityType:$capture.suggestedEntityType,note:$capture.note,processingAttempt:$capture.processingAttempt,processingWorkerId:$capture.processingWorkerId,leaseUntil:$capture.leaseUntil}}' \
                > diagnostics/capture-facebook-event-fast.json
            fi
          fi

          git config user.name 'bndy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/capture-facebook-event-fast.json
          git commit -m 'Record fast Capture production diagnostic' || exit 0
          git push origin HEAD:capture-prod-run
