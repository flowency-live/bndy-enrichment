name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run test
      - run: npm run synth
      - name: Read-only Facebook Event proof
        if: github.event_name == 'pull_request' && github.head_ref == 'capture-facebook-events'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run capture:probe -- --url https://fb.me/e/gwHFuwf71
