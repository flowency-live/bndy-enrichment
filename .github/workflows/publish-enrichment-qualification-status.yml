name: Publish Backline enrichment qualification status

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish Backline enrichment qualification status')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Publish Backline enrichment qualification status'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Resolve the deployed StateTable
        id: resources
        run: |
          set -euo pipefail
          STATE_TABLE=$(aws cloudformation describe-stacks \
            --stack-name BndyEnrichmentStack \
            --query "Stacks[0].Outputs[?OutputKey=='StateTableName'].OutputValue | [0]" \
            --output text)
          test -n "$STATE_TABLE"
          test "$STATE_TABLE" != "None"
          echo "state_table=$STATE_TABLE" >> "$GITHUB_OUTPUT"
      - name: Publish the read-only qualification summary
        env:
          STATE_TABLE: ${{ steps.resources.outputs.state_table }}
          QUALIFICATION_RUN_URL: https://github.com/flowency-live/bndy-enrichment/actions/runs/33264108261
          QUALIFICATION_ARTIFACT_URL: https://github.com/flowency-live/bndy-enrichment/blob/main/ops/enrichment/gemini-grounded-explicit-contract-20-case-unreviewed.json
          QUALIFICATION_REVIEW_URL: https://github.com/flowency-live/bndy-enrichment/blob/main/ops/enrichment/gemini-grounded-explicit-contract-20-case-review.md
        run: |
          set -euo pipefail
          npm run enrichment:qualification:publish -- ops/enrichment/gemini-grounded-explicit-contract-20-case-unreviewed.json | tee qualification-publish.log
          tail -n 1 qualification-publish.log | jq -e \
            '.status == "published"
            and .canonicalWrites == 0
            and .cases == 20
            and .artistCases == 10
            and .venueCases == 10
            and .capturedCases == 20
            and .captureErrors == 0
            and .gateStatus == "awaiting-human-review"
            and .costMeasurement == "complete"
            and .acceptedFacts == 0
            and .quarantinedFacts == 67
            and .highConfidenceCases == 15
            and .abstainedCases == 5' \
            >/dev/null
