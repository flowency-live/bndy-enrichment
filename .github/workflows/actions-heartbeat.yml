name: Actions heartbeat

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heartbeat:
    if: contains(github.event.head_commit.message, 'Test Actions heartbeat')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish heartbeat
        run: |
          mkdir -p docs
          printf '{"actions":"running","verifiedAt":"%s","sha":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" > docs/actions-heartbeat.json
          git config user.name "bndy-actions-heartbeat"
          git config user.email "actions@users.noreply.github.com"
          git add docs/actions-heartbeat.json
          git commit -m "Record Actions heartbeat"
          git push origin HEAD:main
