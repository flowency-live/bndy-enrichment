name: capture-production-diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-production-diagnostic.yml'

permissions:
  contents: write
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Inspect and process the Facebook Event capture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          CAPTURE_FN=$(aws cloudformation describe-stacks \
            --stack-name bndy-capture \
            --query "Stacks[0].Outputs[?OutputKey=='CaptureFunctionName'].OutputValue | [0]" \
            --output text)
          CAPTURE_TOKEN=$(aws lambda get-function-configuration \
            --function-name "$CAPTURE_FN" \
            --query 'Environment.Variables.CAPTURE_TOKEN' \
            --output text)
          echo "::add-mask::$CAPTURE_TOKEN"

          curl -fsS \
            -H "Authorization: Bearer $CAPTURE_TOKEN" \
            'https://capture.bndy.co.uk/v1/captures?limit=100' \
            > /tmp/captures.json

          CAPTURE_ID=$(jq -r '
            (.captures // .items // . // [])
            | map(select(
                ((.sharedUrl // "") | contains("gwHFuwf71")) or
                ((.sharedUrl // "") | contains("1555240929628880")) or
                ((.sharedText // "") | contains("gwHFuwf71")) or
                ((.sharedText // "") | contains("1555240929628880"))
              ))
            | sort_by(.receivedAt // .capturedAt // "")
            | reverse
            | .[0].id // empty
          ' /tmp/captures.json)

          if [ -z "$CAPTURE_ID" ]; then
            jq '{diagnosticVersion:1, result:"NO_MATCHING_CAPTURE", inspectedAt:(now|todateiso8601), recentCaptures:((.captures // .items // . // [])[0:10] | map({id,capturedAt,receivedAt,status,sharedUrl,sharedText,mimeType,sourceApp,note}))}' \
              /tmp/captures.json > diagnostics/capture-facebook-event-latest.json
          else
            echo "Capture ID: $CAPTURE_ID"

            aws lambda invoke \
              --function-name bndy-capture-scan \
              --cli-binary-format raw-in-base64-out \
              --payload '{}' \
              /tmp/scanner.json >/tmp/scanner-meta.json || true

            FINAL_STATUS=""
            for i in $(seq 1 18); do
              curl -fsS \
                -H "Authorization: Bearer $CAPTURE_TOKEN" \
                "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID" \
                > /tmp/capture.json
              FINAL_STATUS=$(jq -r '.capture.status // .status // empty' /tmp/capture.json)
              if [ "$FINAL_STATUS" != "unprocessed" ] && [ "$FINAL_STATUS" != "processing" ] && [ -n "$FINAL_STATUS" ]; then
                break
              fi
              sleep 10
            done

            START_MS=$(( ($(date +%s) - 1800) * 1000 ))
            aws logs filter-log-events \
              --log-group-name '/aws/lambda/bndy-capture-processor' \
              --start-time "$START_MS" \
              --filter-pattern "$CAPTURE_ID" \
              --query 'events[].message' \
              --output json > /tmp/processor-logs.json 2>/dev/null || echo '[]' > /tmp/processor-logs.json

            jq -n \
              --arg inspectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg captureId "$CAPTURE_ID" \
              --argjson capture "$(jq '.capture // .' /tmp/capture.json)" \
              --argjson scanner "$(cat /tmp/scanner.json 2>/dev/null || echo '{}')" \
              --argjson processorLogs "$(cat /tmp/processor-logs.json 2>/dev/null || echo '[]')" \
              '{diagnosticVersion:1,result:"MATCHED_CAPTURE",inspectedAt:$inspectedAt,captureId:$captureId,capture:{id:$capture.id,capturedAt:$capture.capturedAt,receivedAt:$capture.receivedAt,updatedAt:$capture.updatedAt,status:$capture.status,sharedUrl:$capture.sharedUrl,sharedText:$capture.sharedText,mimeType:$capture.mimeType,sourceApp:$capture.sourceApp,suggestedEntityType:$capture.suggestedEntityType,note:$capture.note,processingAttempt:$capture.processingAttempt,processingWorkerId:$capture.processingWorkerId,leaseUntil:$capture.leaseUntil},scanner:$scanner,processorLogs:$processorLogs}' \
              > diagnostics/capture-facebook-event-latest.json
          fi

      - name: Commit sanitized diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bndy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/capture-facebook-event-latest.json
          git commit -m 'Record Capture Facebook Event production test result' || exit 0
          git push origin HEAD:main
