name: Verify Lemonrock production bootstrap

on:
  workflow_run:
    workflows: ["Lemonrock production bootstrap (one-shot)"]
    types: [completed]

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Capture production status
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p docs
          STATE_TABLE=$(aws cloudformation describe-stacks --stack-name BndyEnrichmentStack --query "Stacks[0].Outputs[?OutputKey=='StateTableName'].OutputValue | [0]" --output text)
          QUEUE_URL=$(aws cloudformation describe-stacks --stack-name BndyEnrichmentStack --query "Stacks[0].Outputs[?OutputKey=='SourceScanQueueUrl'].OutputValue | [0]" --output text)
          SOURCE_WORKER=$(aws cloudformation describe-stacks --stack-name BndyEnrichmentStack --query "Stacks[0].Outputs[?OutputKey=='SourceWorkerFunctionName'].OutputValue | [0]" --output text)
          QUEUE=$(aws sqs get-queue-attributes --queue-url "$QUEUE_URL" --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible)
          TASKS=$(aws dynamodb query --table-name "$STATE_TABLE" --key-condition-expression "pk = :pk AND begins_with(sk, :prefix)" --expression-attribute-values '{":pk":{"S":"BOOTSTRAP#lemonrock"},":prefix":{"S":"TASK#"}}' --select COUNT)
          SOURCE=$(aws dynamodb get-item --table-name "$STATE_TABLE" --key '{"pk":{"S":"SOURCE#lemonrock-artist-index"},"sk":{"S":"CONFIG"}}' --projection-expression "id, enabled, shadow, health, nextScanAt")
          jq -n \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runId "$RUN_ID" \
            --arg conclusion "$RUN_CONCLUSION" \
            --arg deployedSha "$DEPLOYED_SHA" \
            --arg stateTable "$STATE_TABLE" \
            --arg sourceWorker "$SOURCE_WORKER" \
            --argjson queue "$QUEUE" \
            --argjson tasks "$TASKS" \
            --argjson source "$SOURCE" \
            '{verifiedAt:$verifiedAt, workflowRunId:$runId, workflowConclusion:$conclusion, deployedSha:$deployedSha, stateTable:$stateTable, sourceWorker:$sourceWorker, queue:$queue.Attributes, tasks:{count:$tasks.Count, scannedCount:$tasks.ScannedCount}, artistIndexSource:$source.Item}' \
            > docs/lemonrock-production-status.json
      - name: Publish status marker
        run: |
          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/lemonrock-production-status.json
          git commit -m "Record Lemonrock production bootstrap status" || exit 0
          git push origin HEAD:main
