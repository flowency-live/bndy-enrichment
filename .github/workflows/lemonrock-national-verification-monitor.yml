name: Monitor Lemonrock national verification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Dispatch a fresh manifest only while verification is active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ops/lemonrock-national-verification.json ]; then
            echo "No national verification status exists"
            exit 0
          fi
          status=$(jq -r '.status // "unknown"' ops/lemonrock-national-verification.json)
          if [ "$status" != "in-progress" ] && [ "$status" != "running" ]; then
            echo "National verification is $status; no manifest dispatched"
            exit 0
          fi
          gh workflow run lemonrock-manifest-readonly.yml --ref main
