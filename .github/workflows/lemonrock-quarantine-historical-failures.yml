name: Quarantine historical source failures

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: lemonrock-national-verification
  cancel-in-progress: false

jobs:
  quarantine:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Quarantine historical source failures')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      AWS_REGION: eu-west-2
      STACK_NAME: BndyEnrichmentStack
      STATUS_FILE: ops/lemonrock-historical-failure-quarantine.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialise sanitised status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          jq -n \
            --arg startedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deployedSha "$(git rev-parse HEAD)" \
            '{
              status:"running",
              phase:"validating",
              startedAt:$startedAt,
              deployedSha:$deployedSha,
              purpose:"retain superseded source delivery copies outside the active DLQ",
              automaticReplay:false,
              destructivePurge:false,
              shadow:true,
              canonicalWritesEnabled:false
            }' > "$STATUS_FILE"

      - name: Require bounded deployment role
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: test -n "$AWS_DEPLOY_ROLE_ARN"

      - name: Configure short-lived deployment credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Validate exact main revision
        env:
          TZ: UTC
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test
          npx cdk synth >/tmp/cdk-synth.log

      - name: Deploy retained quarantine queue
        run: |
          set -euo pipefail
          jq '.phase = "deploying-quarantine"' "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"
          npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json

      - name: Require idle active queue and classify residue
        shell: bash
        run: |
          set -euo pipefail
          jq '.phase = "preflight"' "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"

          state_table=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.StateTableName)")
          source_queue_url=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.SourceScanQueueUrl)")
          quarantine_url=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.HistoricalSourceFailureQuarantineUrl)")
          quarantine_arn=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.HistoricalSourceFailureQuarantineArn)")

          source_attrs=$(aws sqs get-queue-attributes \
            --queue-url "$source_queue_url" \
            --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible ApproximateNumberOfMessagesDelayed RedrivePolicy \
            --output json)
          source_visible=$(jq -r '.Attributes.ApproximateNumberOfMessages // "0"' <<<"$source_attrs")
          source_inflight=$(jq -r '.Attributes.ApproximateNumberOfMessagesNotVisible // "0"' <<<"$source_attrs")
          source_delayed=$(jq -r '.Attributes.ApproximateNumberOfMessagesDelayed // "0"' <<<"$source_attrs")
          test "$source_visible" -eq 0
          test "$source_inflight" -eq 0
          test "$source_delayed" -eq 0

          dlq_arn=$(jq -r '.Attributes.RedrivePolicy | fromjson | .deadLetterTargetArn' <<<"$source_attrs")
          dlq_name=${dlq_arn##*:}
          dlq_url=$(aws sqs get-queue-url --queue-name "$dlq_name" --query QueueUrl --output text)
          dlq_attrs=$(aws sqs get-queue-attributes \
            --queue-url "$dlq_url" \
            --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible \
            --output json)
          dlq_visible=$(jq -r '.Attributes.ApproximateNumberOfMessages // "0"' <<<"$dlq_attrs")
          dlq_inflight=$(jq -r '.Attributes.ApproximateNumberOfMessagesNotVisible // "0"' <<<"$dlq_attrs")
          test "$dlq_visible" -gt 0
          test "$dlq_inflight" -eq 0

          quarantine_attrs=$(aws sqs get-queue-attributes \
            --queue-url "$quarantine_url" \
            --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible \
            --output json)
          quarantine_visible=$(jq -r '.Attributes.ApproximateNumberOfMessages // "0"' <<<"$quarantine_attrs")
          quarantine_inflight=$(jq -r '.Attributes.ApproximateNumberOfMessagesNotVisible // "0"' <<<"$quarantine_attrs")
          test "$quarantine_visible" -eq 0
          test "$quarantine_inflight" -eq 0

          # A zero-visibility sample is observational. It neither deletes nor
          # delays a message, and only aggregate source/kind counts are kept.
          sample=$(aws sqs receive-message \
            --queue-url "$dlq_url" \
            --max-number-of-messages 10 \
            --visibility-timeout 0 \
            --wait-time-seconds 1 \
            --attribute-names ApproximateReceiveCount \
            --output json)
          sample_summary=$(jq -c '[.Messages[]? | (.Body | fromjson? // {}) | {
            sourceId:(.sourceId // "unknown"),
            taskKind:(.task.kind // "unknown")
          }] | group_by([.sourceId,.taskKind]) | map({
            sourceId:.[0].sourceId,
            taskKind:.[0].taskKind,
            count:length
          })' <<<"$sample")

          aws dynamodb query \
            --table-name "$state_table" \
            --key-condition-expression "pk = :pk AND begins_with(sk, :prefix)" \
            --expression-attribute-values '{":pk":{"S":"BOOTSTRAP#lemonrock"},":prefix":{"S":"TASK#"}}' \
            --projection-expression "sourceId, taskKind, #st" \
            --expression-attribute-names '{"#st":"status"}' \
            --output json > /tmp/lemonrock-tasks.json
          failure_summary=$(jq -c '[.Items[] | select(.status.S == "failed") | {
            sourceId:(.sourceId.S // "unknown"),
            taskKind:(.taskKind.S // "unknown")
          }] | group_by([.sourceId,.taskKind]) | map({
            sourceId:.[0].sourceId,
            taskKind:.[0].taskKind,
            uniqueLogicalFailures:length
          })' /tmp/lemonrock-tasks.json)

          jq \
            --argjson activeDlqMessages "$dlq_visible" \
            --argjson sample "$sample_summary" \
            --argjson logicalFailures "$failure_summary" \
            '.preflight = {
               activeQueue:{visible:0,inFlight:0,delayed:0},
               activeDlqMessages:$activeDlqMessages,
               sampledDeliveryCopies:$sample,
               failedLogicalTasks:$logicalFailures
             }
             | .sourceDlqArnClass = "SourceScanDLQ"
             | .quarantineArnClass = "HistoricalSourceFailureQuarantine"' \
            "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"

          {
            echo "SOURCE_DLQ_ARN=$dlq_arn"
            echo "SOURCE_DLQ_URL=$dlq_url"
            echo "QUARANTINE_ARN=$quarantine_arn"
            echo "QUARANTINE_URL=$quarantine_url"
            echo "EXPECTED_MESSAGES=$dlq_visible"
          } >> "$GITHUB_ENV"

      - name: Move delivery copies to retained quarantine
        shell: bash
        run: |
          set -euo pipefail
          jq '.phase = "quarantining"' "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"

          move=$(aws sqs start-message-move-task \
            --source-arn "$SOURCE_DLQ_ARN" \
            --destination-arn "$QUARANTINE_ARN" \
            --max-number-of-messages-per-second 10 \
            --output json)
          task_handle=$(jq -r '.TaskHandle' <<<"$move")
          test -n "$task_handle"

          move_status="RUNNING"
          moved=0
          for attempt in $(seq 1 150); do
            task=$(aws sqs list-message-move-tasks \
              --source-arn "$SOURCE_DLQ_ARN" \
              --max-results 10 \
              --output json | jq -c --arg handle "$task_handle" '.Results[] | select(.TaskHandle == $handle)')
            move_status=$(jq -r '.Status // "UNKNOWN"' <<<"$task")
            moved=$(jq -r '.ApproximateNumberOfMessagesMoved // 0' <<<"$task")
            if [ "$move_status" = "COMPLETED" ]; then break; fi
            if [ "$move_status" = "FAILED" ]; then
              jq -r '.FailureReason // "Message move failed"' <<<"$task"
              exit 1
            fi
            sleep 5
          done
          test "$move_status" = "COMPLETED"

          source_remaining=""
          quarantine_visible=0
          for attempt in $(seq 1 24); do
            source_remaining=$(aws sqs get-queue-attributes \
              --queue-url "$SOURCE_DLQ_URL" \
              --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible \
              --query '[Attributes.ApproximateNumberOfMessages,Attributes.ApproximateNumberOfMessagesNotVisible]' \
              --output text)
            quarantine_visible=$(aws sqs get-queue-attributes \
              --queue-url "$QUARANTINE_URL" \
              --attribute-names ApproximateNumberOfMessages \
              --query 'Attributes.ApproximateNumberOfMessages' \
              --output text)
            if [ "$source_remaining" = $'0\t0' ] && [ "$quarantine_visible" -gt 0 ]; then break; fi
            sleep 5
          done
          test "$source_remaining" = $'0\t0'

          jq \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson expected "$EXPECTED_MESSAGES" \
            --argjson moved "$moved" \
            --argjson retained "$quarantine_visible" \
            '.phase = "quarantined"
             | .status = "complete"
             | .completedAt = $completedAt
             | .result = {
                 expectedDeliveryCopies:$expected,
                 reportedMoved:$moved,
                 retainedInQuarantine:$retained,
                 activeDlqVisible:0,
                 activeDlqInFlight:0
               }' "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"

      - name: Publish sanitised quarantine evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$STATUS_FILE" ]; then
            mkdir -p ops
            jq -n '{status:"failed",phase:"unknown",shadow:true,canonicalWritesEnabled:false}' > "$STATUS_FILE"
          fi
          jq --arg workflowStatus "$JOB_STATUS" --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.workflowStatus = $workflowStatus
             | .updatedAt = $updatedAt
             | if $workflowStatus != "success" and .status == "running" then .status = "failed" else . end' \
            "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"

          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$STATUS_FILE"
          git commit -m "Record historical source failure quarantine" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase --autostash origin/main
          done
          exit 1
