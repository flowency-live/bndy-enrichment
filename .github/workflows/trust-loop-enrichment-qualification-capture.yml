name: Capture Trust Loop enrichment qualification cohort

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: trust-loop-enrichment-qualification-capture
  cancel-in-progress: false

jobs:
  capture:
    if: contains(github.event.head_commit.message, 'Capture Backline enrichment qualification cohort')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Enforce unused one-shot targets
        run: |
          set -euo pipefail
          test ! -e ops/enrichment/gemini-grounded-explicit-contract-20-case-unreviewed.json
          test ! -e ops/enrichment/gemini-grounded-explicit-contract-20-case-review.md
      - name: Load deployed Gemini credential
        run: |
          set -euo pipefail
          SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name BndyEnrichmentStack \
            --query "Stacks[0].Outputs[?OutputKey=='GeminiSecretArn'].OutputValue | [0]" \
            --output text)
          test -n "$SECRET_ARN"
          test "$SECRET_ARN" != "None"
          GEMINI_API_KEY=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --query SecretString \
            --output text | jq -r '.apiKey // empty')
          test -n "$GEMINI_API_KEY"
          echo "::add-mask::$GEMINI_API_KEY"
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> "$GITHUB_ENV"
      - name: Capture bounded grounded-enrichment cases
        env:
          GEMINI_MODEL: gemini-3.6-flash
          ENRICHMENT_CAPTURE_PATH: ops/enrichment/gemini-grounded-explicit-contract-20-case-unreviewed.json
          ENRICHMENT_REVIEW_PATH: ops/enrichment/gemini-grounded-explicit-contract-20-case-review.md
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          npm run trust-loop:capture-enrichment | tee trust-loop-enrichment-capture.log
          artifact=ops/enrichment/gemini-grounded-explicit-contract-20-case-unreviewed.json
          temp=$(mktemp)
          jq '
            .maximumReservedCost = 0.60
            | .reservedCost = 0.60
            | .requestedSearchesPerCaseMaximum = 2
            | .providerMayAutonomouslyExceedSearchRequest = true
            | .totalObservedSearches = ([.items[].bundle.usage.searches // 0] | add)
            | .actualWithinReservedCost = (.totalEstimatedCost <= 0.60)
          ' "$artifact" > "$temp"
          mv "$temp" "$artifact"
          jq -e '
            .cases == 20
            and .artistCases == 10
            and .venueCases == 10
            and .canonicalWrites == 0
            and .reviewStatus == "unreviewed"
            and .maximumReservedCost == 0.60
            and .reservedCost == 0.60
            and .requestedSearchesPerCaseMaximum == 2
            and .providerMayAutonomouslyExceedSearchRequest == true
            and (.items | length) == 20
            and all(.items[]; .canonicalWrites == 0)
            and all(.items[]; .bundle.usage.modelCalls == 1)
          ' "$artifact" >/dev/null
      - name: Record the unreviewed evidence cohort
        run: |
          set -euo pipefail
          git config user.name bndy-backline-bot
          git config user.email actions@users.noreply.github.com
          git pull --rebase --autostash origin main
          git add ops/enrichment/gemini-grounded-explicit-contract-20-case-unreviewed.json ops/enrichment/gemini-grounded-explicit-contract-20-case-review.md
          git commit -m "Record unreviewed Backline enrichment evidence cohort" || true
          git push origin HEAD:main
      - name: Require a complete provider capture
        run: |
          set -euo pipefail
          jq -e '
            .captureErrors == 0
            and .measuredUsageCases == 20
            and all(.items[]; .captureStatus == "captured")
            and all(.items[]; .bundle.raw.providerResponse.status == "completed")
          ' ops/enrichment/gemini-grounded-explicit-contract-20-case-unreviewed.json >/dev/null
