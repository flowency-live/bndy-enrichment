name: Lemonrock production bootstrap (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-and-bootstrap:
    if: contains(github.event.head_commit.message, 'Run Lemonrock production bootstrap')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Deploy Backline runtime
        run: |
          npx cdk bootstrap
          npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json
      - name: Configure Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SECRET_ARN=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.GeminiSecretArn)")
          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ARN" \
            --secret-string "$(node -e 'console.log(JSON.stringify({apiKey:process.env.GEMINI_API_KEY}))')"
      - name: Seed and start Lemonrock national discovery
        run: |
          export STATE_TABLE=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.StateTableName)")
          export SOURCE_SCAN_QUEUE_URL=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.SourceScanQueueUrl)")
          npm run lemonrock:bootstrap -- --mode=discovery
          aws sqs get-queue-attributes \
            --queue-url "$SOURCE_SCAN_QUEUE_URL" \
            --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible
