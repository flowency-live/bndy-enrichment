name: deploy-capture-pipeline

# One-shot push trigger: creating/changing this workflow deploys the capture pipeline.
# It can also be run manually later if required.
# Trigger production deploy and record the Facebook Event Capture acceptance result.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-capture-pipeline.yml'

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout enrichment
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout capture
        uses: actions/checkout@v4
        with:
          repository: flowency-live/bndy-capture
          path: capture

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Recover current capture deployment parameters
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_FN=$(aws cloudformation describe-stacks \
            --stack-name bndy-capture \
            --query "Stacks[0].Outputs[?OutputKey=='CaptureFunctionName'].OutputValue | [0]" \
            --output text)
          test -n "$CAPTURE_FN" && test "$CAPTURE_FN" != "None"

          CAPTURE_TOKEN=$(aws lambda get-function-configuration \
            --function-name "$CAPTURE_FN" \
            --query 'Environment.Variables.CAPTURE_TOKEN' \
            --output text)
          test -n "$CAPTURE_TOKEN" && test "$CAPTURE_TOKEN" != "None"
          echo "::add-mask::$CAPTURE_TOKEN"

          HOSTED_ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name bndy.co.uk \
            --query "HostedZones[?Name=='bndy.co.uk.'] | [0].Id" \
            --output text | sed 's#^/hostedzone/##')
          test -n "$HOSTED_ZONE_ID" && test "$HOSTED_ZONE_ID" != "None"

          echo "CAPTURE_TOKEN=$CAPTURE_TOKEN" >> "$GITHUB_ENV"
          echo "HOSTED_ZONE_ID=$HOSTED_ZONE_ID" >> "$GITHUB_ENV"

      - name: Deploy capture API upgrade
        working-directory: capture/aws
        shell: bash
        run: |
          set -euo pipefail
          sam --version
          sam build
          sam deploy \
            --stack-name bndy-capture \
            --region eu-west-2 \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --parameter-overrides \
              CaptureToken="$CAPTURE_TOKEN" \
              DomainName="capture.bndy.co.uk" \
              HostedZoneId="$HOSTED_ZONE_ID" \
              AllowedOrigin="*" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Install enrichment dependencies
        run: npm install

      - name: Deploy enrichment stack
        run: |
          npx cdk bootstrap
          npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json

      - name: Configure Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          SECRET_ARN=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.GeminiSecretArn)")
          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ARN" \
            --secret-string "$(node -e 'console.log(JSON.stringify({apiKey:process.env.GEMINI_API_KEY}))')"

      - name: Invoke capture scanner
        run: |
          aws lambda invoke \
            --function-name bndy-capture-scan \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            /tmp/capture-scan.json
          cat /tmp/capture-scan.json

      - name: Record Facebook Event Capture acceptance result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          curl -fsS \
            -H "Authorization: Bearer $CAPTURE_TOKEN" \
            'https://capture.bndy.co.uk/v1/captures?limit=100' \
            > /tmp/captures.json

          CAPTURE_ID=$(jq -r '
            (.captures // .items // . // [])
            | map(select(
                ((.sharedUrl // "") | contains("gwHFuwf71")) or
                ((.sharedUrl // "") | contains("1555240929628880")) or
                ((.sharedText // "") | contains("gwHFuwf71")) or
                ((.sharedText // "") | contains("1555240929628880"))
              ))
            | sort_by(.receivedAt // .capturedAt // "")
            | reverse
            | .[0].id // empty
          ' /tmp/captures.json)

          if [ -z "$CAPTURE_ID" ]; then
            jq '{diagnosticVersion:2,result:"NO_MATCHING_CAPTURE",inspectedAt:(now|todateiso8601),recentCaptures:((.captures // .items // . // [])[0:10] | map({id,capturedAt,receivedAt,status,sharedUrl,sharedText,mimeType,sourceApp,note}))}' \
              /tmp/captures.json > diagnostics/capture-facebook-event-latest.json
          else
            FINAL_STATUS=""
            for i in $(seq 1 24); do
              curl -fsS \
                -H "Authorization: Bearer $CAPTURE_TOKEN" \
                "https://capture.bndy.co.uk/v1/captures/$CAPTURE_ID" \
                > /tmp/capture.json
              FINAL_STATUS=$(jq -r '.capture.status // .status // empty' /tmp/capture.json)
              if [ "$FINAL_STATUS" != "unprocessed" ] && [ "$FINAL_STATUS" != "processing" ] && [ -n "$FINAL_STATUS" ]; then
                break
              fi
              if [ "$i" = "8" ] || [ "$i" = "16" ]; then
                aws lambda invoke \
                  --function-name bndy-capture-scan \
                  --cli-binary-format raw-in-base64-out \
                  --payload '{}' \
                  /tmp/capture-scan-retry.json >/dev/null || true
              fi
              sleep 10
            done

            START_MS=$(( ($(date +%s) - 3600) * 1000 ))
            aws logs filter-log-events \
              --log-group-name '/aws/lambda/bndy-capture-processor' \
              --start-time "$START_MS" \
              --filter-pattern "$CAPTURE_ID" \
              --query 'events[].message' \
              --output json > /tmp/processor-logs.json 2>/dev/null || echo '[]' > /tmp/processor-logs.json

            jq -n \
              --arg inspectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg captureId "$CAPTURE_ID" \
              --argjson capture "$(jq '.capture // .' /tmp/capture.json)" \
              --argjson scanner "$(cat /tmp/capture-scan.json 2>/dev/null || echo '{}')" \
              --argjson processorLogs "$(cat /tmp/processor-logs.json 2>/dev/null || echo '[]')" \
              '{diagnosticVersion:2,result:"MATCHED_CAPTURE",inspectedAt:$inspectedAt,captureId:$captureId,capture:{id:$capture.id,capturedAt:$capture.capturedAt,receivedAt:$capture.receivedAt,updatedAt:$capture.updatedAt,status:$capture.status,sharedUrl:$capture.sharedUrl,sharedText:$capture.sharedText,mimeType:$capture.mimeType,sourceApp:$capture.sourceApp,suggestedEntityType:$capture.suggestedEntityType,note:$capture.note,processingAttempt:$capture.processingAttempt,processingWorkerId:$capture.processingWorkerId,leaseUntil:$capture.leaseUntil},scanner:$scanner,processorLogs:$processorLogs}' \
              > diagnostics/capture-facebook-event-latest.json
          fi

          git config user.name 'bndy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/capture-facebook-event-latest.json
          git commit -m 'Record Capture Facebook Event production test result' || exit 0
          git push origin HEAD:main
