name: Probe enrichment AWS secrets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, 'Probe enrichment AWS secrets')
    runs-on: ubuntu-latest
    environment: production
    env:
      ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
      SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish secret-presence probe
        run: |
          set -euo pipefail
          mkdir -p docs
          HAS_ROLE=false; HAS_ACCESS=false; HAS_SECRET=false
          [ -n "$ROLE_ARN" ] && HAS_ROLE=true || true
          [ -n "$ACCESS_KEY" ] && HAS_ACCESS=true || true
          [ -n "$SECRET_KEY" ] && HAS_SECRET=true || true
          printf '{"runId":"%s","hasAwsRoleArn":%s,"hasAwsAccessKeyId":%s,"hasAwsSecretAccessKey":%s,"verifiedAt":"%s"}\n' "$GITHUB_RUN_ID" "$HAS_ROLE" "$HAS_ACCESS" "$HAS_SECRET" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/aws-secret-probe.json
          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/aws-secret-probe.json
          git commit -m "Record enrichment AWS secret probe"
          git push origin HEAD:main
