name: Launch Lemonrock national verification

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: lemonrock-national-verification
  cancel-in-progress: false

jobs:
  launch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Launch Lemonrock national verification')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      AWS_REGION: eu-west-2
      STACK_NAME: BndyEnrichmentStack
      STATUS_FILE: ops/lemonrock-national-verification.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialise sanitised status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          jq -n \
            --arg startedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deployedSha "$(git rev-parse HEAD)" \
            '{
              status:"running",
              phase:"validating",
              startedAt:$startedAt,
              deployedSha:$deployedSha,
              verificationMode:"national-gig-led",
              directoryMode:"inventory-controls-only",
              shadow:true,
              canonicalWritesEnabled:false,
              automaticDeadLetterRedrive:false
            }' > "$STATUS_FILE"

      - name: Require the bounded deployment role
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: test -n "$AWS_DEPLOY_ROLE_ARN"

      - name: Configure short-lived deployment credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Validate exact main revision
        env:
          TZ: UTC
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test
          npx cdk synth >/tmp/cdk-synth.log

      - name: Deploy exact main revision
        run: |
          set -euo pipefail
          jq '.phase = "deploying"' "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"
          npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json

      - name: Verify low-cost schedules and shadow controls
        shell: bash
        run: |
          set -euo pipefail
          jq '.phase = "verifying-safety"' "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"

          stack_resources=$(aws cloudformation list-stack-resources --stack-name "$STACK_NAME" --output json)
          rule_for() {
            local prefix="$1"
            jq -r --arg prefix "$prefix" \
              '.StackResourceSummaries[] | select(.LogicalResourceId | startswith($prefix)) | .PhysicalResourceId' \
              <<<"$stack_resources" | head -n1
          }

          dispatcher_rule=$(rule_for SourceDispatchTick)
          fast_rule=$(rule_for LemonrockFastGigTick)
          health_rule=$(rule_for LemonrockDailyHealthCheck)
          monthly_rule=$(rule_for LemonrockMonthlyFutureReconcile)
          test -n "$dispatcher_rule"
          test -n "$fast_rule"
          test -n "$health_rule"
          test -n "$monthly_rule"

          test "$(aws events describe-rule --name "$dispatcher_rule" --query ScheduleExpression --output text)" = "rate(1 hour)"
          test "$(aws events describe-rule --name "$fast_rule" --query ScheduleExpression --output text)" = "rate(1 hour)"
          test "$(aws events describe-rule --name "$health_rule" --query ScheduleExpression --output text)" = "cron(10 2 * * ? *)"
          test "$(aws events describe-rule --name "$monthly_rule" --query ScheduleExpression --output text)" = "cron(20 2 1 * ? *)"

          directory_rules=$(jq -r \
            '[.StackResourceSummaries[].LogicalResourceId | select(test("Lemonrock.*(Directory|Weekly)"))] | length' \
            <<<"$stack_resources")
          test "$directory_rules" -eq 0

          state_table=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.StateTableName)")
          queue_url=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.SourceScanQueueUrl)")
          for source_id in \
            lemonrock-new-gigs lemonrock-cancellations lemonrock-artist-index lemonrock-venue-index \
            lemonrock-artist-hydration lemonrock-venue-hydration lemonrock-gig-hydration \
            lemonrock-future-reconcile lemonrock-full-reconcile; do
            source=$(aws dynamodb get-item \
              --table-name "$state_table" \
              --key "{\"pk\":{\"S\":\"SOURCE#$source_id\"},\"sk\":{\"S\":\"CONFIG\"}}" \
              --projection-expression "enabled, shadow" \
              --output json)
            test "$(jq -r '.Item.enabled.BOOL' <<<"$source")" = "true"
            test "$(jq -r '.Item.shadow.BOOL' <<<"$source")" = "true"
          done

          {
            echo "STATE_TABLE=$state_table"
            echo "SOURCE_SCAN_QUEUE_URL=$queue_url"
          } >> "$GITHUB_ENV"

      - name: Require an empty source queue and DLQ
        shell: bash
        run: |
          set -euo pipefail
          jq '.phase = "preflight"' "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"

          queue_attrs=$(aws sqs get-queue-attributes \
            --queue-url "$SOURCE_SCAN_QUEUE_URL" \
            --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible ApproximateNumberOfMessagesDelayed RedrivePolicy \
            --output json)
          dlq_arn=$(jq -r '.Attributes.RedrivePolicy | fromjson | .deadLetterTargetArn' <<<"$queue_attrs")
          dlq_name=${dlq_arn##*:}
          dlq_url=$(aws sqs get-queue-url --queue-name "$dlq_name" --query QueueUrl --output text)
          dlq_attrs=$(aws sqs get-queue-attributes \
            --queue-url "$dlq_url" \
            --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible \
            --output json)

          visible=$(jq -r '.Attributes.ApproximateNumberOfMessages // "0"' <<<"$queue_attrs")
          inflight=$(jq -r '.Attributes.ApproximateNumberOfMessagesNotVisible // "0"' <<<"$queue_attrs")
          delayed=$(jq -r '.Attributes.ApproximateNumberOfMessagesDelayed // "0"' <<<"$queue_attrs")
          dlq_visible=$(jq -r '.Attributes.ApproximateNumberOfMessages // "0"' <<<"$dlq_attrs")
          dlq_inflight=$(jq -r '.Attributes.ApproximateNumberOfMessagesNotVisible // "0"' <<<"$dlq_attrs")

          jq \
            --argjson visible "$visible" \
            --argjson inflight "$inflight" \
            --argjson delayed "$delayed" \
            --argjson dlqVisible "$dlq_visible" \
            --argjson dlqInflight "$dlq_inflight" \
            '.preflightQueue = {
              visible:$visible,
              inFlight:$inflight,
              delayed:$delayed,
              deadLetterVisible:$dlqVisible,
              deadLetterInFlight:$dlqInflight
            }' "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"

          if [ "$visible" -ne 0 ] || [ "$inflight" -ne 0 ] || [ "$delayed" -ne 0 ] \
            || [ "$dlq_visible" -ne 0 ] || [ "$dlq_inflight" -ne 0 ]; then
            jq '.phase = "preflight-blocked" | .status = "blocked"' "$STATUS_FILE" > "$STATUS_FILE.tmp"
            mv "$STATUS_FILE.tmp" "$STATUS_FILE"
            echo "Source queue or DLQ is not empty; national verification was not launched"
            exit 1
          fi

      - name: Launch owned national verification
        shell: bash
        run: |
          set -euo pipefail
          prior_reconciliation=$(aws dynamodb get-item \
            --table-name "$STATE_TABLE" \
            --key '{"pk":{"S":"SOURCE#lemonrock-full-reconcile"},"sk":{"S":"STATE"}}' \
            --projection-expression "metadata" \
            --query 'Item.metadata.M.lastReconciliationId.S' \
            --output text 2>/dev/null || true)

          requested_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          body=$(jq -nc --arg requestedAt "$requested_at" '{
            sourceId:"lemonrock-full-reconcile",
            reason:"manual",
            requestedAt:$requestedAt,
            task:{
              kind:"full-reconcile",
              url:"https://www.lemonrock.com/",
              auditRun:true,
              directoryAuditOnly:true,
              verificationVersion:"national-audit-v1"
            }
          }')
          aws sqs send-message --queue-url "$SOURCE_SCAN_QUEUE_URL" --message-body "$body" >/dev/null

          reconciliation_id=""
          for attempt in $(seq 1 60); do
            reconciliation_id=$(aws dynamodb get-item \
              --table-name "$STATE_TABLE" \
              --key '{"pk":{"S":"SOURCE#lemonrock-full-reconcile"},"sk":{"S":"STATE"}}' \
              --projection-expression "metadata" \
              --query 'Item.metadata.M.lastReconciliationId.S' \
              --output text 2>/dev/null || true)
            if [ -n "$reconciliation_id" ] && [ "$reconciliation_id" != "None" ] \
              && [ "$reconciliation_id" != "$prior_reconciliation" ]; then
              break
            fi
            sleep 5
          done
          test -n "$reconciliation_id"
          test "$reconciliation_id" != "None"
          test "$reconciliation_id" != "$prior_reconciliation"

          queue_attrs=$(aws sqs get-queue-attributes \
            --queue-url "$SOURCE_SCAN_QUEUE_URL" \
            --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible \
            --output json)
          jq \
            --arg requestedAt "$requested_at" \
            --arg reconciliationId "$reconciliation_id" \
            --argjson queue "$queue_attrs" \
            '.phase = "launched"
             | .status = "in-progress"
             | .requestedAt = $requestedAt
             | .reconciliationId = $reconciliationId
             | .launchQueue = $queue.Attributes' \
            "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"

      - name: Publish sanitised launch evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$STATUS_FILE" ]; then
            mkdir -p ops
            jq -n --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{status:"failed",phase:"unknown",completedAt:$at,shadow:true,canonicalWritesEnabled:false}' \
              > "$STATUS_FILE"
          fi
          jq --arg jobStatus "$JOB_STATUS" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.workflowStatus = $jobStatus
             | .updatedAt = $at
             | if $jobStatus != "success" and .status == "running" then .status = "failed" else . end' \
            "$STATUS_FILE" > "$STATUS_FILE.tmp"
          mv "$STATUS_FILE.tmp" "$STATUS_FILE"

          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$STATUS_FILE"
          git commit -m "Record Lemonrock national verification launch" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase --autostash origin/main
          done
          exit 1
