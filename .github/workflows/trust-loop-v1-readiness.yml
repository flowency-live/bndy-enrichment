name: Read Backline Trust Loop v1 source readiness

on:
  push:
    branches: [main]
    paths: ['.github/workflows/trust-loop-v1-readiness.yml']

permissions:
  contents: write
  id-token: write

jobs:
  read-readiness:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Read sanitised source state
        id: readiness
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p ops
          aws cloudformation describe-stacks --stack-name BndyEnrichmentStack > readiness-stack.json
          STATE_TABLE=$(jq -r '.Stacks[0].Outputs[] | select(.OutputKey=="StateTableName") | .OutputValue' readiness-stack.json)
          BROWSER_QUEUE=$(jq -r '.Stacks[0].Outputs[] | select(.OutputKey=="BrowserScanQueueUrl") | .OutputValue' readiness-stack.json)
          BROWSER_FUNCTION=$(jq -r '.Stacks[0].Outputs[] | select(.OutputKey=="BrowserSourceWorkerFunctionName") | .OutputValue' readiness-stack.json)
          mkdir -p readiness-items
          jq -n '[]' > readiness-items/sources.json
          for SOURCE_ID in lemonrock-new-gigs onthecase-gig-index klma-stoke-gig-list gigs-news-daily-import; do
            aws dynamodb get-item --table-name "$STATE_TABLE" --key "{\"pk\":{\"S\":\"SOURCE#$SOURCE_ID\"},\"sk\":{\"S\":\"CONFIG\"}}" > readiness-items/config.json
            aws dynamodb get-item --table-name "$STATE_TABLE" --key "{\"pk\":{\"S\":\"SOURCE#$SOURCE_ID\"},\"sk\":{\"S\":\"STATE\"}}" > readiness-items/state.json
            jq \
              --arg source "$SOURCE_ID" \
              --slurpfile config readiness-items/config.json \
              --slurpfile state readiness-items/state.json '
                def ddb:
                  if type != "object" then .
                  elif has("S") then .S
                  elif has("N") then (.N | tonumber)
                  elif has("BOOL") then .BOOL
                  elif has("NULL") then null
                  elif has("M") then (.M | map_values(ddb))
                  elif has("L") then [.L[] | ddb]
                  else . end;
                ($config[0].Item // {} | map_values(ddb)) as $cfg |
                ($state[0].Item // {} | map_values(ddb)) as $run |
                . + [{
                  sourceId: $source,
                  config: {
                    enabled: ($cfg.enabled // null),
                    shadow: ($cfg.shadow // null),
                    writerAuthority: ($cfg.writerAuthority // null),
                    cadence: ($cfg.cadence // null),
                    mode: ($cfg.mode // null),
                    snapshotSemantics: ($cfg.snapshotSemantics // null)
                  },
                  state: {
                    lastRunAt: ($run.lastRunAt // null),
                    lastSuccessfulRunAt: ($run.lastSuccessfulRunAt // null),
                    lastFailureAt: ($run.lastFailureAt // null),
                    consecutiveFailures: ($run.consecutiveFailures // 0),
                    lastErrorClass: (
                      if ($run.lastError // "" | test("HTTP 403"; "i")) then "HTTP_403"
                      elif ($run.lastError // "" | test("HTTP 429"; "i")) then "HTTP_429"
                      elif ($run.lastError // "" | test("HTTP 5[0-9][0-9]"; "i")) then "HTTP_5XX"
                      elif ($run.lastError // "" | test("timeout|timed out|abort"; "i")) then "TIMEOUT"
                      elif ($run.lastError // "" | test("structural gate|recognisable HTML"; "i")) then "STRUCTURAL_GATE"
                      elif ($run.lastError // "" | test("parse|parser"; "i")) then "PARSER"
                      elif ($run.lastError // "") != "" then "OTHER"
                      else null end
                    )
                  }
                }]' readiness-items/sources.json > readiness-items/sources.next.json
            mv readiness-items/sources.next.json readiness-items/sources.json
          done
          aws lambda get-function-configuration --function-name "$BROWSER_FUNCTION" > readiness-items/function.json || echo '{}' > readiness-items/function.json
          aws lambda list-event-source-mappings --function-name "$BROWSER_FUNCTION" > readiness-items/mappings.json || echo '{"EventSourceMappings":[]}' > readiness-items/mappings.json
          aws sqs get-queue-attributes --queue-url "$BROWSER_QUEUE" --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible ApproximateNumberOfMessagesDelayed RedrivePolicy > readiness-items/queue.json || echo '{"Attributes":{}}' > readiness-items/queue.json
          DLQ_ARN=$(jq -r '.Attributes.RedrivePolicy // "{}" | fromjson? | .deadLetterTargetArn // ""' readiness-items/queue.json)
          if [ -n "$DLQ_ARN" ]; then
            DLQ_NAME=${DLQ_ARN##*:}
            DLQ_URL=$(aws sqs get-queue-url --queue-name "$DLQ_NAME" --query QueueUrl --output text)
            aws sqs get-queue-attributes --queue-url "$DLQ_URL" --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible > readiness-items/dlq.json || echo '{"Attributes":{}}' > readiness-items/dlq.json
          else
            echo '{"Attributes":{}}' > readiness-items/dlq.json
          fi
          START_MS="$(($(date -u -d '2 hours ago' +%s) * 1000))"
          aws logs filter-log-events \
            --log-group-name "/aws/lambda/$BROWSER_FUNCTION" \
            --start-time "$START_MS" \
            --limit 100 > readiness-items/logs.json || echo '{"events":[]}' > readiness-items/logs.json
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile sources readiness-items/sources.json \
            --slurpfile function readiness-items/function.json \
            --slurpfile mappings readiness-items/mappings.json \
            --slurpfile queue readiness-items/queue.json \
            --slurpfile dlq readiness-items/dlq.json \
            --slurpfile logs readiness-items/logs.json '
              def error_class:
                . as $message |
                if ($message | test("Runtime.ImportModuleError|Cannot find module"; "i")) then "IMPORT"
                elif ($message | test("chromium|puppeteer|browser"; "i")) then "BROWSER_RUNTIME"
                elif ($message | test("timed out|timeout"; "i")) then "TIMEOUT"
                elif ($message | test("HTTP 403"; "i")) then "HTTP_403"
                elif ($message | test("HTTP 429"; "i")) then "HTTP_429"
                elif ($message | test("HTTP 5[0-9][0-9]"; "i")) then "HTTP_5XX"
                else "OTHER" end;
              {
                schemaVersion: 1,
                generatedAt: $generatedAt,
                readOnly: true,
                canonicalWrites: 0,
                sources: $sources[0],
                browserRuntime: {
                  functionState: ($function[0].State // null),
                  lastUpdateStatus: ($function[0].LastUpdateStatus // null),
                  stateReasonCode: ($function[0].StateReasonCode // null),
                  mappingState: ($mappings[0].EventSourceMappings[0].State // null),
                  lastProcessingResult: ($mappings[0].EventSourceMappings[0].LastProcessingResult // null),
                  queue: {
                    visible: ($queue[0].Attributes.ApproximateNumberOfMessages // "0" | tonumber),
                    inFlight: ($queue[0].Attributes.ApproximateNumberOfMessagesNotVisible // "0" | tonumber),
                    delayed: ($queue[0].Attributes.ApproximateNumberOfMessagesDelayed // "0" | tonumber)
                  },
                  deadLetter: {
                    visible: ($dlq[0].Attributes.ApproximateNumberOfMessages // "0" | tonumber),
                    inFlight: ($dlq[0].Attributes.ApproximateNumberOfMessagesNotVisible // "0" | tonumber)
                  },
                  recentErrorClasses: ([$logs[0].events[]?.message
                    | select(test("ERROR|Exception|ImportModuleError|timed out|HTTP 4|HTTP 5|chromium|puppeteer|browser"; "i"))
                    | error_class] | group_by(.) | map({key:.[0],value:length}) | from_entries)
                }
              }' \
            > ops/trust-loop-v1-readiness.json
          jq empty ops/trust-loop-v1-readiness.json
      - name: Record probe failure safely
        if: steps.readiness.outcome != 'success'
        run: |
          mkdir -p ops
          jq -n --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1, generatedAt:$generatedAt, readOnly:true, canonicalWrites:0, status:"probe-failed", sources:[]}' \
            > ops/trust-loop-v1-readiness.json
      - name: Publish readiness evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name bndy-backline-bot
          git config user.email actions@users.noreply.github.com
          git add ops/trust-loop-v1-readiness.json
          git commit -m "Record Backline Trust Loop v1 source readiness" || exit 0
          git pull --rebase --autostash origin main
          git push origin HEAD:main
