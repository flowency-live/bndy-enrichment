name: Validate Interactions evidence-first citations

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "Run one Interactions evidence-first Whittles validation"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: trust-loop-interactions-evidence-first-validation
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      (github.event_name == 'workflow_dispatch'
      && github.event.inputs.confirmation == 'Run one Interactions evidence-first Whittles validation')
      || (github.event_name == 'push'
      && startsWith(github.event.head_commit.message, 'Run one Interactions evidence-first Whittles validation'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Enforce unused one-shot target
        run: test ! -e ops/enrichment/gemini-interactions-evidence-first-whittles-oldham-unreviewed.json
      - name: Load deployed Gemini credential
        run: |
          set -euo pipefail
          SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name BndyEnrichmentStack \
            --query "Stacks[0].Outputs[?OutputKey=='GeminiSecretArn'].OutputValue | [0]" \
            --output text)
          test -n "$SECRET_ARN"
          test "$SECRET_ARN" != "None"
          GEMINI_API_KEY=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --query SecretString \
            --output text | jq -r '.apiKey // empty')
          test -n "$GEMINI_API_KEY"
          echo "::add-mask::$GEMINI_API_KEY"
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> "$GITHUB_ENV"
      - name: Capture exactly one shadow-only Whittles validation
        env:
          GEMINI_MODEL: gemini-3.6-flash
          ENRICHMENT_VALIDATION_PATH: ops/enrichment/gemini-interactions-evidence-first-whittles-oldham-unreviewed.json
        run: |
          set -euo pipefail
          npm run trust-loop:validate-interactions-evidence-first | tee interactions-evidence-first.log
          jq -e '
            .cases == 1
            and .canonicalWrites == 0
            and .reviewStatus == "unreviewed"
            and .adapterStatus == "inactive"
            and .scheduleCreated == false
            and .providerActivated == false
            and .maximumReservedCost == 0.05
          ' ops/enrichment/gemini-interactions-evidence-first-whittles-oldham-unreviewed.json >/dev/null
      - name: Commit the public response or exact failure
        run: |
          set -euo pipefail
          git config user.name bndy-backline-bot
          git config user.email actions@users.noreply.github.com
          git pull --rebase --autostash origin main
          git add ops/enrichment/gemini-interactions-evidence-first-whittles-oldham-unreviewed.json
          git commit -m "Record Interactions evidence-first Whittles validation"
          git push origin HEAD:main
      - name: Require a positive exact-segment citation result
        run: |
          jq -e '
            .case.captureStatus == "captured"
            and .contract.exactlyOneModelCallObserved == true
            and .contract.observedWithinRequestedSearches == true
            and .contract.citationCount > 0
            and .contract.admittedFacts > 0
            and .contract.allAdmittedFactsHaveProviderSegmentCitations == true
            and .contract.providerResponseCaptured == true
            and .actualWithinReservedCost == true
          ' ops/enrichment/gemini-interactions-evidence-first-whittles-oldham-unreviewed.json >/dev/null
