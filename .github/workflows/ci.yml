name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run test
      - run: npm run synth

  capture-facebook-event-proof:
    if: github.event_name == 'pull_request' && github.head_ref == 'capture-facebook-events'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Load production Gemini secret without exposing it
        shell: bash
        run: |
          set -euo pipefail
          SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name BndyEnrichmentStack \
            --region eu-west-2 \
            --query "Stacks[0].Outputs[?OutputKey=='GeminiSecretArn'].OutputValue | [0]" \
            --output text)
          test -n "$SECRET_ARN" && test "$SECRET_ARN" != "None"
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --region eu-west-2 \
            --secret-id "$SECRET_ARN" \
            --query SecretString \
            --output text)
          GEMINI_API_KEY=$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.apiKey ?? x.GEMINI_API_KEY ?? "")' "$SECRET_JSON")
          test -n "$GEMINI_API_KEY"
          echo "::add-mask::$GEMINI_API_KEY"
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> "$GITHUB_ENV"
      - name: Read-only Facebook Event proof
        run: npm run capture:probe -- --url https://fb.me/e/gwHFuwf71
