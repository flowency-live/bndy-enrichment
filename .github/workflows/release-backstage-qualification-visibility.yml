name: Release Backstage qualification visibility

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release Backstage qualification visibility')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Start and verify the Backstage release
        env:
          AMPLIFY_APP_ID: d3hbhqxqqchzbb
          AMPLIFY_BRANCH: main
        run: |
          set -euo pipefail
          JOB_ID=$(aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "Amplify job: $JOB_ID"
          for ATTEMPT in $(seq 1 90); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)
            echo "poll=$ATTEMPT status=$STATUS"
            case "$STATUS" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) exit 1 ;;
            esac
            sleep 10
          done
          echo "Backstage release did not finish inside 15 minutes" >&2
          exit 1
