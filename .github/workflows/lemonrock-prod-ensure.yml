name: Ensure Lemonrock production is running

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  ensure:
    if: contains(github.event.head_commit.message, 'Ensure Lemonrock production is running')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Wait for enrichment stack to be idle
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            STATUS=$(aws cloudformation describe-stacks --stack-name BndyEnrichmentStack --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo MISSING)
            case "$STATUS" in
              *_IN_PROGRESS) sleep 10 ;;
              *) echo "Stack status: $STATUS"; break ;;
            esac
          done
      - name: Deploy exact main revision
        run: |
          set -euo pipefail
          npx cdk bootstrap
          npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json
      - name: Configure Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          SECRET_ARN=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.GeminiSecretArn)")
          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ARN" \
            --secret-string "$(node -e 'console.log(JSON.stringify({apiKey:process.env.GEMINI_API_KEY}))')" >/dev/null
      - name: Seed and start Lemonrock national discovery
        run: |
          set -euo pipefail
          export STATE_TABLE=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.StateTableName)")
          export SOURCE_SCAN_QUEUE_URL=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.SourceScanQueueUrl)")
          npm run lemonrock:bootstrap -- --mode=discovery | tee /tmp/bootstrap-output.txt
      - name: Confirm production activity and publish evidence
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          STATE_TABLE=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.StateTableName)")
          QUEUE_URL=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.SourceScanQueueUrl)")
          SOURCE_WORKER=$(node -e "const x=require('./cdk-outputs.json'); console.log(x.BndyEnrichmentStack.SourceWorkerFunctionName)")
          TASK_COUNT=0
          OBS_COUNT=0
          for i in $(seq 1 30); do
            TASK_COUNT=$(aws dynamodb query --table-name "$STATE_TABLE" --key-condition-expression "pk = :pk AND begins_with(sk, :prefix)" --expression-attribute-values '{":pk":{"S":"BOOTSTRAP#lemonrock"},":prefix":{"S":"TASK#"}}' --select COUNT --query Count --output text)
            OBS_COUNT=$(aws dynamodb query --table-name "$STATE_TABLE" --index-name ObservationClaimsIndex --key-condition-expression "GSI1PK = :pk AND begins_with(GSI1SK, :prefix)" --expression-attribute-values '{":pk":{"S":"SOURCE#lemonrock-artist-index"},":prefix":{"S":"OBS#"}}' --select COUNT --query Count --output text)
            if [ "$TASK_COUNT" -gt 0 ] || [ "$OBS_COUNT" -gt 0 ]; then break; fi
            sleep 5
          done
          QUEUE=$(aws sqs get-queue-attributes --queue-url "$QUEUE_URL" --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible)
          WORKER_ENV=$(aws lambda get-function-configuration --function-name "$SOURCE_WORKER" --query 'Environment.Variables.SOURCE_SCAN_QUEUE_URL' --output text)
          SOURCE=$(aws dynamodb get-item --table-name "$STATE_TABLE" --key '{"pk":{"S":"SOURCE#lemonrock-artist-index"},"sk":{"S":"CONFIG"}}' --projection-expression "id, enabled, shadow, health, nextScanAt")
          mkdir -p docs
          jq -n \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deployedSha "$DEPLOYED_SHA" \
            --arg stateTable "$STATE_TABLE" \
            --arg sourceWorker "$SOURCE_WORKER" \
            --arg workerQueueEnv "$WORKER_ENV" \
            --argjson taskCount "$TASK_COUNT" \
            --argjson observationCount "$OBS_COUNT" \
            --argjson queue "$QUEUE" \
            --argjson source "$SOURCE" \
            '{verifiedAt:$verifiedAt, deployment:"success", deployedSha:$deployedSha, stateTable:$stateTable, sourceWorker:$sourceWorker, sourceWorkerQueueConfigured:($workerQueueEnv != "None" and $workerQueueEnv != ""), lemonrockTaskCount:$taskCount, artistIndexObservationCount:$observationCount, queue:$queue.Attributes, artistIndexSource:$source.Item, shadowMode:true, canonicalWritesEnabled:false}' \
            > docs/lemonrock-production-status.json
          cat docs/lemonrock-production-status.json
          test "$WORKER_ENV" != "None"
          test "$TASK_COUNT" -gt 0 -o "$OBS_COUNT" -gt 0
          git config user.name "bndy-backline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/lemonrock-production-status.json
          git commit -m "Record Lemonrock production running status"
          git push origin HEAD:main
